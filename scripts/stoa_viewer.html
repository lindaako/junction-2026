<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Blueprints Talk</title>
<style>
  :root { --ink:#16181d; --panel:#1f2229; --line:#333843; --text:#e9e6df; --dim:#9a9aa0; --gold:#d4a84a;
          --ok:#4fbf7a; --bad:#e2685f; --rooms:#e6a23c; --doors:#ef5350; --openings:#b06fe0; --windows:#4d9bf0; --fixtures:#37c08a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--ink); color:var(--text);
         display:grid; grid-template-rows:auto 1fr; height:100vh; }
  header { display:flex; gap:24px; align-items:baseline; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; color:var(--gold); font-weight:600; }
  header .stat b { font-size:16px; } header .stat { color:var(--dim); } header .stat b { color:var(--text); }
  main { display:grid; grid-template-columns:230px 1fr 380px; min-height:0; }
  aside, section { overflow:auto; min-height:0; }
  #plans { border-right:1px solid var(--line); }
  #side { border-left:1px solid var(--line); padding:12px; }
  .plan { padding:7px 12px; cursor:pointer; border-bottom:1px solid #262a32; display:flex; justify-content:space-between; gap:8px; }
  .plan:hover { background:#252931; } .plan.sel { background:#2c313b; border-left:3px solid var(--gold); padding-left:9px; }
  .plan small { color:var(--dim); white-space:nowrap; } .plan span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stagewrap { padding:12px; display:flex; flex-direction:column; gap:8px; }
  #toolbar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--dim); }
  #toolbar label { cursor:pointer; user-select:none; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  #stage { position:relative; align-self:flex-start; max-width:100%; background:#fff; }
  #stage img { display:block; max-width:100%; max-height:calc(100vh - 130px); }
  .box { position:absolute; border:2px solid; border-radius:2px; pointer-events:auto; }
  .box i { position:absolute; left:-2px; top:-15px; font:600 10px/14px system-ui; padding:0 3px; color:#fff; font-style:normal; white-space:nowrap; }
  .box.faint { opacity:.22; border-width:1px; } .box.faint i { display:none; }
  .box.hit { border-width:3px; box-shadow:0 0 0 2px rgba(255,255,255,.7); }
  .box.skip { border-style:dashed; opacity:.8; }
  .box.rooms { border-width:1px; } .box.rooms i { top:1px; left:1px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 6px; }
  #answer { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; max-height:46vh; overflow:auto; }
  #answer .big { font-size:34px; font-weight:700; line-height:1; }
  #answer .ok { color:var(--ok); } #answer .bad { color:var(--bad); }
  #answer ul { margin:6px 0 0; padding-left:18px; } #answer li { margin:2px 0; }
  #answer .why { color:var(--dim); }
  input[type=search] { width:100%; padding:6px 8px; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; }
  .q { padding:6px 8px; border-radius:6px; cursor:pointer; display:grid; grid-template-columns:16px 1fr auto; gap:6px; }
  .q:hover { background:#252931; } .q.sel { background:#2c313b; }
  .q .n { color:var(--dim); white-space:nowrap; }
  .mark.ok { color:var(--ok); } .mark.bad { color:var(--bad); }
  .note { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Make Blueprints Talk</h1>
  <span class="stat" id="stats"></span>
  <span class="note">Each plan is read once into a graph. Every answer below is a query over that graph: no model call per question.</span>
</header>
<main>
  <aside id="plans"></aside>
  <section id="stagewrap">
    <div id="toolbar"></div>
    <div id="stage"><img id="img" alt="floor plan"></div>
  </section>
  <aside id="side">
    <div id="answer"></div>
    <h2>Questions on this plan</h2>
    <input type="search" id="filter" placeholder="Filter questions (e.g. door, ikkuna, sauna)">
    <div id="qs"></div>
  </aside>
</main>
<script src="data.js"></script>
<script>
const D = window.DEMO, COLLS = ["rooms", "openings", "doors", "windows", "fixtures"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
let pi = 0, qi = null, show = { rooms: true, openings: true, doors: true, windows: true, fixtures: true };
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function describe(coll, n, rooms) {
  const name = id => { const r = rooms[id]; return r ? (r.label_text || r.room_type) : id; };
  let t = n.id + ": ";
  if (coll === "rooms") t += (n.label_text ? '"' + n.label_text + '" ' : "") + n.room_type;
  if (coll === "doors") t += (n.leaves === 2 ? "double door" : "door") + " " + n.connects.map(name).join(" – ") +
      ({ closet: " (cupboard front)", entrance: " (entrance)" }[n.kind] || "");
  if (coll === "openings") t += "opening without door " + n.connects.map(name).join(" – ");
  if (coll === "windows") t += "window" + (n.panes > 1 ? ", " + n.panes + " panes" : "");
  if (coll === "fixtures") t += n.type.replace("_", " ") + (n.in_room ? " in " + name(n.in_room) : "");
  if (n.status !== "printed") t += " [" + n.status.replace("_", " ") + "]";
  if (n.cut_off) t += " [cut off at edge]";
  return t;
}

function renderPlans() {
  el("plans").innerHTML = D.plans.map((p, i) => {
    const ok = p.questions.filter(q => q.correct).length;
    return `<div class="plan ${i === pi ? "sel" : ""}" data-i="${i}"><span title="${esc(p.path)}">${esc(p.name)}</span><small>${ok}/${p.questions.length}</small></div>`;
  }).join("");
  el("plans").querySelectorAll(".plan").forEach(d => d.onclick = () => { pi = +d.dataset.i; qi = null; render(); });
}

function renderStage() {
  const p = D.plans[pi], g = p.graph, q = qi === null ? null : p.questions[qi];
  const rooms = Object.fromEntries(g.rooms.map(r => [r.id, r]));
  el("img").src = p.img;
  el("stage").querySelectorAll(".box").forEach(b => b.remove());
  for (const coll of COLLS) {
    if (!show[coll] && !(q && q.collection === coll)) continue;
    for (const n of g[coll] || []) {
      const [y0, x0, y1, x1] = n.box_2d, color = css(coll);
      let cls = "box " + coll;
      if (q) cls += q.collection !== coll ? " faint" : q.used.includes(n.id) ? " hit" : " skip";
      const b = document.createElement("div");
      b.className = cls; b.title = describe(coll, n, rooms);
      b.style.cssText = `left:${x0 / 10}%;top:${y0 / 10}%;width:${(x1 - x0) / 10}%;height:${(y1 - y0) / 10}%;border-color:${color}`;
      b.innerHTML = `<i style="background:${color}">${esc(coll === "rooms" ? (n.label_text || n.room_type) : n.id)}</i>`;
      el("stage").appendChild(b);
    }
  }
  el("toolbar").innerHTML = COLLS.map(c => `<label><input type="checkbox" data-c="${c}" ${show[c] ? "checked" : ""}> <span class="sw" style="background:${css(c)}"></span>${c} (${(g[c] || []).length})</label>`).join("") +
    `<span class="note">Hover a box for details. Dashed = seen but not counted for this question.</span>`;
  el("toolbar").querySelectorAll("input").forEach(c => c.onchange = () => { show[c.dataset.c] = c.checked; renderStage(); });
}

function renderAnswer() {
  const p = D.plans[pi], g = p.graph, a = el("answer");
  const rooms = Object.fromEntries(g.rooms.map(r => [r.id, r]));
  if (qi === null) {
    const edges = (g.doors || []).filter(d => d.kind === "passage").length + (g.openings || []).length;
    a.innerHTML = `<b>${esc(p.name)}</b><div class="why">Graph: ${g.rooms.length} rooms, ${g.doors.length} doors, ${(g.openings || []).length} openings, ${g.windows.length} windows, ${g.fixtures.length} fixtures, ${g.floors} floor(s); ${edges} room-to-room connections.</div>
      <div class="why">Read by: ${esc(p.models.layout || "?")} (layout)${p.models.symbols ? ", " + esc(p.models.symbols) + " (zoomed symbols)" : ""}.</div>
      ${g.unreachable && g.unreachable.length ? `<div class="why">Check: ${g.unreachable.length} room(s) have no recorded door or opening, so door counts on this plan are less certain.</div>` : `<div class="why">Check passed: every room is reachable through a door or opening.</div>`}
      <div class="why" style="margin-top:6px">Pick a question below.</div>`;
    return;
  }
  const q = p.questions[qi], nodes = (g[q.collection] || []);
  const used = nodes.filter(n => q.used.includes(n.id)), skipped = nodes.filter(n => !q.used.includes(n.id));
  const relevant = q.collection === "floors" ? [] : skipped.filter(n => n.status !== "printed" || n.kind === "closet" || n.cut_off);
  a.innerHTML = `<div>${esc(q.q)}</div>
    <div style="display:flex;gap:16px;align-items:flex-end;margin-top:8px">
      <div><div class="big ${q.correct ? "ok" : "bad"}">${q.pred ?? "–"}</div><div class="why">answer from graph</div></div>
      <div><div class="big" style="font-size:22px">${q.truth}</div><div class="why">ground truth ${q.correct ? "✓" : "✗"}</div></div>
    </div>
    ${q.collection === "floors" ? `<div class="why" style="margin-top:8px">Plan-level value stored in the graph.</div>` :
      `<div class="why" style="margin-top:8px">Counted ${used.length} ${esc(q.collection)} (highlighted on the plan):</div>
       <ul>${used.map(n => `<li>${esc(describe(q.collection, n, rooms))}</li>`).join("") || "<li>none found</li>"}</ul>`}
    ${relevant.length ? `<div class="why" style="margin-top:6px">Seen but not counted:</div><ul>${relevant.map(n => `<li class="why">${esc(describe(q.collection, n, rooms))}</li>`).join("")}</ul>` : ""}`;
}

function renderQs() {
  const p = D.plans[pi], f = el("filter").value.toLowerCase();
  el("qs").innerHTML = p.questions.map((q, i) => ({ q, i })).filter(x => x.q.q.toLowerCase().includes(f)).map(({ q, i }) =>
    `<div class="q ${i === qi ? "sel" : ""}" data-i="${i}"><span class="mark ${q.correct ? "ok" : "bad"}">${q.correct ? "✓" : "✗"}</span><span>${esc(q.q)}</span><span class="n">${q.pred ?? "–"} / ${q.truth}</span></div>`).join("");
  el("qs").querySelectorAll(".q").forEach(d => d.onclick = () => { qi = qi === +d.dataset.i ? null : +d.dataset.i; render(); });
}

function render() { renderPlans(); renderStage(); renderAnswer(); renderQs(); }
const s = D.stats;
el("title").textContent = D.title; document.title = D.title;
el("stats").innerHTML = `<b>${(100 * s.correct / Math.max(s.questions, 1)).toFixed(1)}%</b> exact match on ${s.questions} questions, ${s.plans} plans` +
  (s.baseline !== null ? ` · no-model baseline <b>${s.baseline}%</b>` : "") +
  (s.calls_per_question !== null ? ` · <b>${s.calls_per_question}</b> vision calls per question` : "");
el("filter").oninput = renderQs;
render();
</script>
</body>
</html>
