# docker compose up -d db        -> just Postgres (run the backend locally with uvicorn)
# docker compose up --build      -> Postgres + backend
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: junction
      POSTGRES_PASSWORD: junction
      POSTGRES_DB: junction
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://junction:junction@db:5432/junction
    ports: ["8000:8000"]
    depends_on: [db]

volumes:
  pgdata:
